<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Royal Marina</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#0b3d5c;
    color:white;
    text-align:center;
    padding:40px;
}

.container{
    padding:20px;
    max-width:800px;
    margin:auto;
}

.card{
    background:white;
    margin:15px 0;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

a{
    text-decoration:none;
    color:#0b3d5c;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>Hotel Royal Marina</h1>
    <p>Guest Information Portal</p>
</header>

<div class="container">

    <div class="card">
        <h2>Wi-Fi</h2>
        <p>Network: HotelGuest</p>
        <p>Password: Welcome123</p>
    </div>

    <div class="card">
        <h2>Breakfast</h2>
        <p>07:00 - 10:30</p>
    </div>

    <div class="card">
        <h2>Restaurant Menu</h2>
        <a href="#">View Menu</a>
    </div>

    <div class="card">
        <h2>Hotel Facilities</h2>
        <p>Pool, Gym, Spa</p>
    </div>

    <div class="card">
        <h2>Reception</h2>
        <p>Dial 100 from your room.</p>
    </div>

</div>

</body>
</html>
